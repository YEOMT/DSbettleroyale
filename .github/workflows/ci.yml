name: CI
on:
  pull_request: null
  push:
    branches:
      - main
permissions:
  contents: read
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  quick:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      docs: ${{ steps.plan.outputs.docs }}
      combat: ${{ steps.plan.outputs.combat }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - id: plan
        run: node tools/ci/plan.mjs "$BASE"
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
      - run: npm run quick
      - run: npm run build
        if: steps.plan.outputs.docs != 'true'
        env:
          BUILD_ID: ${{ github.sha }}
      - run: |
          python3 -m unittest discover -s tests/releaseops -p "test_*.py"
          python3 -m py_compile tools/deploy/host.py tools/deploy/bootstrap.py
          bash -n deploy/install-release.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: quick-${{ github.sha }}
          path: |-
            artifacts/check-plan.json
            artifacts/quick-results.json
            dist/
          retention-days: 30
  targeted:
    needs: quick
    if: needs.quick.outputs.docs != 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@v4
        with:
          name: quick-${{ github.sha }}
      - run: npx playwright install --with-deps chromium
      - run: npm run test:targeted
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: targeted-${{ github.sha }}
          path: |-
            artifacts/
            playwright-report/
            test-results/
          retention-days: 30
  combat:
    needs: quick
    if: needs.quick.outputs.combat == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        renderer: [canvas, pixi]
        suite: [recovery, continuous]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version-file: .nvmrc, cache: npm}
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npx playwright install --with-deps webkit
        if: matrix.renderer == 'canvas' && matrix.suite == 'recovery'
      - run: node tests/combat/run.mjs ${{ matrix.renderer }} ${{ matrix.suite }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: combat-${{ matrix.renderer }}-${{ matrix.suite }}-${{ github.sha }}
          path: artifacts/
          retention-days: 30
  required-checks:
    if: always()
    needs:
      - quick
      - targeted
      - combat
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - env:
          COMBAT: ${{ needs.combat.result }}
          SELECTED: ${{ needs.quick.outputs.combat }}
          QUICK: ${{ needs.quick.result }}
          TARGET: ${{ needs.targeted.result }}
          DOCS: ${{ needs.quick.outputs.docs }}
        run: node -e 'if(process.env.COMBAT!==(process.env.SELECTED==="true"?"success":"skipped")||process.env.QUICK!=="success"||(process.env.DOCS==="true"?process.env.TARGET!=="skipped":process.env.TARGET!=="success"))process.exit(1)'
