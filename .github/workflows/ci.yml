name: CI
on:
  pull_request: null
  push:
    branches:
      - main
permissions:
  contents: read
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  quick:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      docs: ${{ steps.plan.outputs.docs }}
      combat: ${{ steps.plan.outputs.combat }}
      roster10: ${{ steps.plan.outputs.roster10 }}
      characterShards: ${{ steps.plan.outputs.characterShards }}
      releaseops: ${{ steps.plan.outputs.releaseops }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - id: plan
        run: node tools/ci/plan.mjs "$BASE"
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
      - run: npm run quick
      - run: npm run build
        if: steps.plan.outputs.docs != 'true'
        env:
          BUILD_ID: ${{ github.sha }}
      - run: |
          python3 -m unittest discover -s tests/releaseops -p "test_*.py"
          python3 -m py_compile tools/deploy/host.py tools/deploy/bootstrap.py
          bash -n deploy/install-release.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: quick-${{ github.sha }}
          path: |-
            artifacts/check-plan.json
            artifacts/quick-results.json
            dist/
          retention-days: 30
  characters:
    needs: quick
    if: needs.quick.outputs.characterShards != '[]'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    container: mcr.microsoft.com/playwright:v1.56.1-noble
    strategy:
      fail-fast: false
      matrix:
        shard: ${{ fromJSON(needs.quick.outputs.characterShards) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version-file: .nvmrc, cache: npm}
      - run: npm ci
      - run: node tests/fidelity-v33-2/all77.mjs ${{ matrix.shard.renderer }} balanced
        env:
          FIDELITY_CHARACTERS: ${{ matrix.shard.ids }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: characters-${{ github.sha }}-${{ matrix.shard.key }}
          path: artifacts/fidelity-v33-2/
          retention-days: 30
  targeted:
    needs: [quick, characters]
    if: ${{ !cancelled() && needs.quick.result == 'success' && needs.quick.outputs.docs != 'true' && ((needs.quick.outputs.characterShards == '[]' && needs.characters.result == 'skipped') || needs.characters.result == 'success') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    container: mcr.microsoft.com/playwright:v1.56.1-noble
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@v4
        with:
          name: quick-${{ github.sha }}
      - if: needs.quick.outputs.characterShards != '[]'
        uses: actions/download-artifact@v4
        with:
          pattern: characters-${{ github.sha }}-*
          path: artifacts/character-shards
      - run: npm run test:targeted
        env:
          CI_CHARACTER_REPORTS: ${{ needs.quick.outputs.characterShards != '[]' && 'artifacts/character-shards' || '' }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: targeted-${{ github.sha }}
          path: |-
            artifacts/
            playwright-report/
            test-results/
          retention-days: 30
  isolated-release:
    needs: quick
    if: needs.quick.outputs.releaseops == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version-file: .nvmrc}
      - id: fixture
        run: node tools/deploy/select-validation-fixture.mjs
        env:
          FIXTURE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          GITHUB_TOKEN: ${{ github.token }}
      - uses: actions/download-artifact@v4
        with:
          name: release-${{ steps.fixture.outputs.sha }}
          run-id: ${{ steps.fixture.outputs.run }}
          github-token: ${{ github.token }}
          path: artifacts/candidate
      - run: node artifacts/candidate/ops/node_modules/playwright/cli.js install --with-deps chromium
      - run: node tools/deploy/isolated.mjs
        env:
          RELEASE_SHA: ${{ steps.fixture.outputs.sha }}
          CANDIDATE_RUN_ID: ${{ steps.fixture.outputs.run }}
      - name: Inject observer loss and require Results and Rematch after the warning
        run: node tests/releaseops/resume-warning-browser.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: isolated-ci-${{ github.sha }}
          path: |
            artifacts/isolated-validation.json
            artifacts/resume-warning-fixture.json
          retention-days: 30
  combat:
    needs: quick
    if: needs.quick.outputs.combat == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        renderer: [canvas, pixi]
        suite: [recovery, continuous, touch]
        exclude:
          - {renderer: pixi, suite: continuous}
          - {renderer: pixi, suite: recovery}
        include:
          - {renderer: pixi, suite: continuous, role: attacker}
          - {renderer: pixi, suite: continuous, role: opponent}
          - {renderer: pixi, suite: continuous, role: host}
          - {renderer: pixi, suite: recovery, part: controls}
          - {renderer: pixi, suite: recovery, part: roster}
    container: mcr.microsoft.com/playwright:v1.56.1-noble
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version-file: .nvmrc, cache: npm}
      - run: npm ci
      - run: node tests/combat/run.mjs ${{ matrix.renderer }} ${{ matrix.suite }}
        env:
          COMBAT_PIXI_ROLE: ${{ matrix.role || '' }}
          COMBAT_RECOVERY_PART: ${{ matrix.part || '' }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: combat-${{ matrix.renderer }}-${{ matrix.suite }}-${{ matrix.role || matrix.part || 'all' }}-${{ github.sha }}
          path: artifacts/
          retention-days: 30
  roster10:
    needs: quick
    if: needs.quick.outputs.roster10 == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    container: mcr.microsoft.com/playwright:v1.56.1-noble
    strategy:
      fail-fast: false
      matrix:
        renderer: [canvas, pixi]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version-file: .nvmrc, cache: npm}
      - run: npm ci
      - run: node tests/roster10/flow.mjs ${{ matrix.renderer }}
      - if: matrix.renderer == 'canvas'
        run: node tests/roster10/live.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: roster10-${{ matrix.renderer }}-${{ github.sha }}
          path: artifacts/roster10/
          retention-days: 30
  required-checks:
    if: always()
    needs:
      - quick
      - targeted
      - combat
      - roster10
      - isolated-release
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - env:
          COMBAT: ${{ needs.combat.result }}
          SELECTED: ${{ needs.quick.outputs.combat }}
          QUICK: ${{ needs.quick.result }}
          TARGET: ${{ needs.targeted.result }}
          DOCS: ${{ needs.quick.outputs.docs }}
          ROSTER10: ${{ needs.roster10.result }}
          NEW_SELECTED: ${{ needs.quick.outputs.roster10 }}
          ISOLATED: ${{ needs.isolated-release.result }}
          OPS_SELECTED: ${{ needs.quick.outputs.releaseops }}
        run: node -e 'if(process.env.ISOLATED!==(process.env.OPS_SELECTED==="true"?"success":"skipped")||process.env.ROSTER10!==(process.env.NEW_SELECTED==="true"?"success":"skipped")||process.env.COMBAT!==(process.env.SELECTED==="true"?"success":"skipped")||process.env.QUICK!=="success"||(process.env.DOCS==="true"?process.env.TARGET!=="skipped":process.env.TARGET!=="success"))process.exit(1)'
