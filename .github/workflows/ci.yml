name: CI
on:
  pull_request:
  push:
    branches: [main, 'codex/**']
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run verify
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - run: npm run test:fidelity
      - run: node tests/fidelity/visuals.mjs
        env:
          FIDELITY_RENDERER: pixi
      - run: npm run test:fidelity-audit
      - run: npm run test:load -- --players=26 --seconds=20
      - name: Retain executed results and matching builds
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ci-${{ github.sha }}
          path: |
            dist/
            artifacts/
            playwright-report/
            test-results/
          retention-days: 30
