name: Paired candidate
on:
  workflow_run:
    workflows:
      - CI
    types:
      - completed
    branches:
      - main
permissions:
  contents: read
  actions: read
concurrency:
  group: releaseops-host
  cancel-in-progress: false
jobs:
  candidate:
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push' && github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    outputs:
      sha: ${{ steps.guard.outputs.sha }}
      ready: ${{ steps.ready.outputs.ready }}
    env:
      PUBLIC_HTTP_API_URL: ${{ vars.PUBLIC_HTTP_API_URL || 'https://15-165-114-145.sslip.io' }}
      STAGING_HTTP_URL: ${{ vars.STAGING_HTTP_URL || 'https://staging.15-165-114-145.sslip.io' }}
      RELEASE_SHA: ${{ github.event.workflow_run.head_sha }}
      GITHUB_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.workflow_run.head_sha }}
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - id: guard
        run: node --input-type=module -e 'import fs from "node:fs";import {trustedRun,github} from "./tools/deploy/trust.mjs";const e=JSON.parse(fs.readFileSync(process.env.GITHUB_EVENT_PATH));trustedRun(e.workflow_run,process.env.GITHUB_REPOSITORY,process.env.RELEASE_SHA,".github/workflows/ci.yml");const b=await github("/repos/"+process.env.GITHUB_REPOSITORY+"/branches/main");if(b.commit.sha!==process.env.RELEASE_SHA)throw Error("SUPERSEDED");fs.appendFileSync(process.env.GITHUB_OUTPUT,"sha="+process.env.RELEASE_SHA+"\n");'
      - uses: actions/download-artifact@v4
        with:
          name: quick-${{ env.RELEASE_SHA }}
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}
      - id: ready
        run: node -e 'const fs=require("fs"),p=JSON.parse(fs.readFileSync("artifacts/check-plan.json"));fs.appendFileSync(process.env.GITHUB_OUTPUT,"ready="+!p.docsOnly+"\n");'
      - uses: actions/download-artifact@v4
        if: steps.ready.outputs.ready == 'true'
        with:
          name: targeted-${{ env.RELEASE_SHA }}
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}
          path: artifacts/ci-targeted
      - if: steps.ready.outputs.ready == 'true'
        run: |-
          cp artifacts/ci-targeted/artifacts/targeted-results.json artifacts/targeted-results.json
          node tools/deploy/candidate.mjs
      - if: steps.ready.outputs.ready == 'true'
        run: npx playwright install --with-deps chromium
      - if: steps.ready.outputs.ready == 'true'
        run: node tests/releaseops/variants.mjs
      - if: steps.ready.outputs.ready == 'true'
        uses: docker/setup-buildx-action@v3
      - if: steps.ready.outputs.ready == 'true'
        uses: docker/build-push-action@v6
        with:
          context: artifacts/candidate/production
          file: deploy/Runtime.Dockerfile
          load: true
          tags: dsbr-production:${{ env.RELEASE_SHA }}
          cache-from: type=gha,scope=dsbr-production
          cache-to: type=gha,mode=max,scope=dsbr-production
      - if: steps.ready.outputs.ready == 'true'
        uses: docker/build-push-action@v6
        with:
          context: artifacts/candidate/staging
          file: deploy/Runtime.Dockerfile
          load: true
          tags: dsbr-staging:${{ env.RELEASE_SHA }}
          cache-from: type=gha,scope=dsbr-staging
          cache-to: type=gha,mode=max,scope=dsbr-staging
      - if: steps.ready.outputs.ready == 'true'
        run: |-
          docker save -o artifacts/candidate/production-image.tar "dsbr-production:$RELEASE_SHA"
          docker save -o artifacts/candidate/staging-image.tar "dsbr-staging:$RELEASE_SHA"
          node tools/deploy/seal-artifact.mjs
      - uses: actions/upload-artifact@v4
        if: steps.ready.outputs.ready == 'true'
        with:
          name: release-${{ env.RELEASE_SHA }}
          path: artifacts/candidate/
          # The sealed manifest includes ops/deploy/.env.example. candidate.mjs
          # excludes actual .env secrets; preserve sealed hidden example files.
          include-hidden-files: true
          retention-days: 30
      - run: 'echo "ARTIFACT_READY is not a deployment. Staging: $STAGING_HTTP_URL; production: https://yeomt.github.io/DSbettleroyale/; release $RELEASE_SHA" >> "$GITHUB_STEP_SUMMARY"'
  staging:
    needs: candidate
    if: needs.candidate.outputs.ready == 'true' && vars.STAGING_ENABLED == 'true'
    environment: staging
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
      DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
      SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
      KNOWN_HOSTS: ${{ secrets.KNOWN_HOSTS }}
      DEPLOY_STATE_DIR: ${{ vars.DEPLOY_STATE_DIR }}
      TARGET: staging
      RELEASE_SHA: ${{ needs.candidate.outputs.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ needs.candidate.outputs.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - uses: actions/download-artifact@v4
        with:
          name: release-${{ env.RELEASE_SHA }}
          path: artifacts/candidate
      - run: node tools/deploy/remote.mjs upload
      - run: node artifacts/candidate/ops/node_modules/playwright/cli.js install --with-deps chromium
      - run: node artifacts/candidate/ops/tools/deploy/remote.mjs stage
      - run: node artifacts/candidate/ops/tools/deploy/remote.mjs commit
      - if: failure()
        run: |-
          node artifacts/candidate/ops/tools/deploy/remote.mjs restore
          node artifacts/candidate/ops/tools/deploy/remote.mjs finish-rollback
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: staging-state-${{ env.RELEASE_SHA }}
          path: artifacts/transaction.json
          retention-days: 30
  status:
    needs:
      - candidate
      - staging
    if: always()
    runs-on: ubuntu-24.04
    steps:
      - env:
          ENABLED: ${{ vars.STAGING_ENABLED }}
          RESULT: ${{ needs.staging.result }}
        run: 'if [ "$ENABLED" != true ]; then echo "BLOCKED_CONFIGURATION: staging bootstrap/Secrets not enabled; no server changed." >> "$GITHUB_STEP_SUMMARY"; else echo "staging job: $RESULT" >> "$GITHUB_STEP_SUMMARY"; fi'
