name: Evolution comparison
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'apps/**'
      - 'packages/**'
      - 'tests/combat/**'
      - '.github/workflows/evolution.yml'
permissions:
  contents: read
jobs:
  compare:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.pull_request.body, '[v35-evidence]')
    runs-on: ubuntu-24.04
    container: mcr.microsoft.com/playwright:v1.56.1-noble
    timeout-minutes: 14
    strategy:
      fail-fast: false
      matrix:
        mode: [solo, team-capture]
        renderer: [canvas, pixi]
        include:
          - {mode: scissors, renderer: pixi}
          - {mode: load30, renderer: sockets}
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-node@v4
        with: {node-version-file: .nvmrc, cache: npm}
      - run: npm ci
      - run: node tests/combat/classroom-compare.mjs v35 ${{ matrix.mode }} ${{ matrix.renderer }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v35-compare-${{ matrix.mode }}-${{ matrix.renderer }}-${{ github.sha }}
          path: artifacts/v35-comparison
  screens:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.pull_request.body, '[v35-evidence]')
    runs-on: ubuntu-24.04
    container: mcr.microsoft.com/playwright:v1.56.1-noble
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        renderer: [canvas, pixi]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version-file: .nvmrc, cache: npm}
      - run: npm ci
      - run: node tests/combat/evolution-browser.mjs ${{ matrix.renderer }}
      - if: matrix.renderer == 'pixi'
        run: node tests/combat/evolution-farm.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v35-screens-${{ matrix.renderer }}-${{ github.sha }}
          path: artifacts/v35/
