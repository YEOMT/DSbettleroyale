name: v35.6 Pixi cause separation
on:
  pull_request:
    paths:
      - '.github/workflows/recovery356-diagnostic.yml'
      - 'tools/ci/recovery356-diagnostic.mjs'
      - 'tests/combat/recovery356-profiler.mjs'
      - 'tests/combat/recovery356-browser-meter.mjs'
  workflow_dispatch: null
permissions:
  contents: read
jobs:
  comparison:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    container: mcr.microsoft.com/playwright:v1.56.1-noble
    strategy:
      fail-fast: false
      matrix:
        players: [20, 30]
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-node@v4
        with: {node-version-file: .nvmrc, cache: npm}
      - run: npm ci
      - run: node tools/ci/recovery356-diagnostic.mjs
        env:
          POLISH_PLAYERS: ${{ matrix.players }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: recovery356-diagnostic-${{ matrix.players }}-${{ github.sha }}
          path: |
            artifacts/v35-6/diagnostic/diagnostic-*.json
            artifacts/v35-6/diagnostic/diag-*.json
            artifacts/v35-6/diagnostic/*.log
          retention-days: 30
