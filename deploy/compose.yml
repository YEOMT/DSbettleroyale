services:
  game:
    image: ${SERVER_IMAGE:?Set the verified paired server image}
    restart: unless-stopped
    init: true
    env_file: .env
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      DRAIN_ON_START: ${DRAIN_ON_START:-false}
    ports: ["127.0.0.1:8080:8080"]
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 1g
    cpus: 2.0
    volumes: [results:/data]
    logging:
      driver: json-file
      options: {max-size: 10m, max-file: '3'}
  caddy:
    image: ${CADDY_IMAGE:?Set a pinned official Caddy image digest}
    restart: unless-stopped
    env_file: .env
    ports: ["80:80", "443:443", "443:443/udp"]
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    logging:
      driver: json-file
      options: {max-size: 10m, max-file: '3'}
volumes:
  results:
  caddy_data:
  caddy_config:
